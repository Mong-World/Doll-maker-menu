<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Doll Maker - Survival Guide</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Dark Background -->

    <div id="overlay">

        <!-- Guide Window -->

        <div id="guide">

            <!-- Close Button -->

            <button id="closeButton">&times;</button>

            <!-- Main Information Image -->

            <div id="imageContainer">

                <img
                    id="guideImage"
                    src="assets/controls.jpeg"
                    alt="Guide Page">

            </div>

            <!-- Navigation Buttons -->

            <div id="navigation">

                <img
                    id="controlsButton"
                    class="navButton active"
                    src="assets/controlsbutton.jpeg"
                    alt="Controls">

                <img
                    id="inventoryButton"
                    class="navButton"
                    src="assets/inventorybutton.jpeg"
                    alt="Inventory">

                <img
                    id="fearButton"
                    class="navButton"
                    src="assets/fearinfobutton.jpeg"
                    alt="Fear Information">

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
