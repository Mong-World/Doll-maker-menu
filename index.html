<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The Doll Maker - Survival Guide</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="overlay">

        <div id="guide">

            <!-- Custom close button -->
            <img
                id="closeButton"
                src="assets/cross.png"
                alt="Close survival guide"
                draggable="false"
            >

            <!-- Main information page -->
            <div id="imageContainer">

                <img
                    id="guideImage"
                    src="assets/controls.jpeg"
                    alt="Controls information"
                    draggable="false"
                >

                <!-- Buttons sit inside the main page -->
                <nav id="navigation" aria-label="Survival guide sections">

                    <img
                        id="controlsButton"
                        class="navButton active"
                        src="assets/controlsbutton.jpeg"
                        alt="Show controls information"
                        draggable="false"
                    >

                    <img
                        id="inventoryButton"
                        class="navButton"
                        src="assets/inventorybutton.jpeg"
                        alt="Show inventory information"
                        draggable="false"
                    >

                    <img
                        id="fearButton"
                        class="navButton"
                        src="assets/fearinfobutton.jpeg"
                        alt="Show fear information"
                        draggable="false"
                    >

                </nav>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
