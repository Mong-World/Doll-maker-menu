<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The Doll Maker – Survival Guide</title>

    <!-- v=4 forces GitHub/browser to load the new CSS -->
    <link rel="stylesheet" href="style.css?v=4">
</head>

<body>

    <div id="overlay">

        <main id="guide">

            <!-- This must be an image, not a button -->
            <img
                id="closeButton"
                src="assets/cross.png"
                alt="Close guide"
                draggable="false"
            >

            <div id="imageContainer">

                <img
                    id="guideImage"
                    src="assets/controls.jpeg"
                    alt="Controls information"
                    draggable="false"
                >

                <nav id="navigation" aria-label="Guide sections">

                    <img
                        id="controlsButton"
                        class="navButton active"
                        src="assets/controlsbutton.jpeg"
                        alt="Controls"
                        draggable="false"
                    >

                    <img
                        id="inventoryButton"
                        class="navButton"
                        src="assets/inventorybutton.jpeg"
                        alt="Inventory information"
                        draggable="false"
                    >

                    <img
                        id="fearButton"
                        class="navButton"
                        src="assets/fearinfobutton.jpeg"
                        alt="Fear information"
                        draggable="false"
                    >

                </nav>

            </div>

        </main>

    </div>

    <!-- v=4 forces GitHub/browser to load the new JavaScript -->
    <script src="script.js?v=4"></script>

</body>

</html>
