<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Survival Guide</title>

    <link
        rel="stylesheet"
        href="style.css?v=7"
    >
</head>

<body>

    <main id="overlay">

        <section id="guideContainer">

            <img
                id="guideImage"
                src="assets/controls.jpeg"
                alt="Controls information"
            >

            <button
                id="closeButton"
                type="button"
                aria-label="Close guide"
            >
                <img
                    src="assets/cross.png"
                    alt=""
                >
            </button>

            <nav
                id="navigation"
                aria-label="Guide pages"
            >

                <button
                    id="controlsButton"
                    class="menuButton active"
                    type="button"
                    aria-label="Show controls"
                >
                    <img
                        src="assets/controlsbutton.jpeg"
                        alt="Controls"
                    >
                </button>

                <button
                    id="inventoryButton"
                    class="menuButton"
                    type="button"
                    aria-label="Show inventory information"
                >
                    <img
                        src="assets/inventorybutton.jpeg"
                        alt="Inventory"
                    >
                </button>

                <button
                    id="fearButton"
                    class="menuButton"
                    type="button"
                    aria-label="Show fear information"
                >
                    <img
                        src="assets/fearinfobutton.jpeg"
                        alt="Fear information"
                    >
                </button>

            </nav>

        </section>

    </main>

    <script src="script.js?v=7"></script>

</body>
</html>
